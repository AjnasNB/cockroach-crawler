<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Cockroach Crawler - give your AI agents the web, keep the keys">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1512"/>
      <stop offset="55%" stop-color="#0e1916"/>
      <stop offset="100%" stop-color="#101f1a"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79f2a6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#79f2a6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#79f2a6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#79f2a6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#79f2a6" stop-opacity="0"/>
    </radialGradient>
    <g id="mark" transform="translate(-32 -32)">
      <g fill="none" stroke="#79f2a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M27 18 18 9M37 18l9-9"/>
        <path d="m24 27-10-5m9 12H11m14 8-9 8m24-23 10-5M41 34h12m-14 8 9 8"/>
      </g>
      <path d="M32 15c-5 0-8 4-8 9v2h16v-2c0-5-3-9-8-9Z" fill="#eff3ed"/>
      <path d="M22 27h20v9c0 3-2 6-5 7H27c-3-1-5-4-5-7Z" fill="#eff3ed"/>
      <path d="M26 43h12l-1 8c-.4 3-2.5 5-5 5s-4.6-2-5-5Z" fill="#eff3ed"/>
      <path d="M25 32h14" stroke="#0e1916" stroke-width="3"/>
      <path d="M28 45h8" stroke="#79f2a6" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>

  <g opacity="0.07" stroke="#79f2a6" stroke-width="1">
    <path d="M0 110h1280M0 220h1280M0 330h1280"/>
    <path d="M320 0v440M640 0v440M960 0v440"/>
  </g>

  <g transform="translate(640 104) scale(1.95)">
    <use href="#mark"/>
  </g>

  <text x="640" y="244" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="-1.2" fill="#eff3ed">Cockroach Crawler</text>

  <text x="640" y="288" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="600" fill="#79f2a6">Give your AI agents the web. Keep the keys.</text>

  <rect x="380" y="314" width="520" height="1.5" fill="url(#rule)"/>

  <text x="640" y="350" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif"
