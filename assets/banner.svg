  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cfe0d8">
    <g transform="translate(343 382)">
      <rect x="0" y="0" width="146" height="34" rx="8" fill="#132420" stroke="#1f3a32"/>
      <text x="73" y="22" text-anchor="middle">MIT licensed</text>
    </g>
    <g transform="translate(505 382)">
      <rect x="0" y="0" width="170" height="34" rx="8" fill="#132420" stroke="#1f3a32"/>
      <text x="85" y="22" text-anchor="middle">Node.js 22 / 24 / 26</text>
    </g>
    <g transform="translate(691 382)">
      <rect x="0" y="0" width="118" height="34" rx="8" fill="#132420" stroke="#1f3a32"/>
      <text x="59" y="22" text-anchor="middle">370 tests</text>
    </g>
    <g transform="translate(825 382)">
      <rect x="0" y="0" width="112" height="34" rx="8" fill="#132420" stroke="#1f3a32"/>
      <text x="56" y="22" text-anchor="middle">No signup</text>
    </g>
