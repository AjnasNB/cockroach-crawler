name: Publish npm on version change

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-cockroach-crawler
  cancel-in-progress: false

jobs:
  detect:
    name: Detect a version bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.compare.outputs.version }}
      dist_tag: ${{ steps.compare.outputs.dist_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # This job deliberately uses no actions. "Failed to resolve action
      # download info" is a control-plane failure during job setup, before any
      # step runs, so the cheapest gate in the pipeline should not depend on
      # resolving anything. gh, jq, and npm are preinstalled on the runner.
      - name: Compare package version against the previous commit
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          read_version() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=$1" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null \
              | node -pe 'try{JSON.parse(require("node:fs").readFileSync(0,"utf8")).version||""}catch{""}' 2>/dev/null \
              || echo ""
          }
          current="$(read_version "${GITHUB_SHA}")"
          parent="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.parents[0].sha // empty')"
          previous=""
          if [[ -n "${parent}" ]]; then previous="$(read_version "${parent}")"; fi
          [[ -n "${current}" ]] || { echo "Could not read package.json at ${GITHUB_SHA}." >&2; exit 1; }
          echo "current=${current} previous=${previous}"
          [[ "${current}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version." >&2; exit 1; }
          # A manual dispatch means "publish the current version if npm does not
          # already have it", so the parent comparison only gates pushes.
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "${current}" == "${previous}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Version unchanged; nothing to publish."
            exit 0
          fi
          if npm view "cockroach-crawler@${current}" version >/dev/null 2>&1; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "cockroach-crawler@${current} is already published; refusing to republish."
            exit 0
          fi
          if [[ "${current}" == *-* ]]; then tag=next; else tag=latest; fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "version=${current}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${tag}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Run the release gate
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      size_bytes: ${{ steps.pack.outputs.size_bytes }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 24
          cache: npm

      # npm trusted publishing over OIDC needs a recent npm. Node 24 ships an
      # older one that silently falls back to token auth, which the registry
      # answers with a 404 on PUT. Both jobs pin the same version because they
      # compare tarball digests, and different npm versions pack differently.
      - name: Pin the npm used for packing and publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "12.0.1"
      - name: Install
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Release gate
        run: npm run release:check

      - name: Verify published benchmark evidence
        run: npm run bench:public:verify

      - name: Pack and record the artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --silent)"
          sha256="$(sha256sum "${tarball}" | cut -d' ' -f1)"
          size="$(stat -c%s "${tarball}")"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          echo "size_bytes=${size}" >> "${GITHUB_OUTPUT}"
          echo "Packed ${tarball} (${size} bytes, sha256 ${sha256})"

  publish:
    name: Publish to npm
    needs: [detect, verify]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/cockroach-crawler/v/${{ needs.detect.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      DIST_TAG: ${{ needs.detect.outputs.dist_tag }}
      EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
      EXPECTED_SIZE_BYTES: ${{ needs.verify.outputs.size_bytes }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm trusted publishing over OIDC needs a recent npm. Node 24 ships an
      # older one that silently falls back to token auth, which the registry
      # answers with a 404 on PUT. Both jobs pin the same version because they
      # compare tarball digests, and different npm versions pack differently.
      - name: Pin the npm used for packing and publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "12.0.1"
      - name: Install
        run: npm ci

      - name: Repack and confirm the artifact matches the verified one
        id: repack
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --silent)"
          sha256="$(sha256sum "${tarball}" | cut -d' ' -f1)"
          size="$(stat -c%s "${tarball}")"
          [[ "${sha256}" == "${EXPECTED_SHA256}" ]] || { echo "Tarball digest changed since verification." >&2; exit 1; }
          [[ "${size}" == "${EXPECTED_SIZE_BYTES}" ]] || { echo "Tarball size changed since verification." >&2; exit 1; }
          [[ "$(node -p 'require("./package.json").version')" == "${VERSION}" ]] || { echo "Version drift." >&2; exit 1; }
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"

      - name: Publish
        run: npm publish "${{ steps.repack.outputs.tarball }}" --access public --ignore-scripts --provenance --tag "${DIST_TAG}"
