name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - bench/results/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cockroach-crawler-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: website
      url: https://cockroachcrawler.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wait for the exact npm package version
        shell: bash
        run: |
          set -euo pipefail
          retry_delay_seconds() {
            local attempt="$1"
            local delay=$((2 ** (attempt - 1)))
            if (( delay > 30 )); then delay=30; fi
            printf '%s' "${delay}"
          }
          version="$(node -p 'require("./package.json").version')"
          published_version=""
          for attempt in {1..30}; do
            published_version="$(npm view "cockroach-crawler@${version}" version 2>/dev/null || true)"
            if [[ "${published_version}" == "${version}" ]]; then
              echo "cockroach-crawler@${version} is published; website verification may proceed."
              break
            fi
            if (( attempt < 30 )); then
              delay="$(retry_delay_seconds "${attempt}")"
              echo "cockroach-crawler@${version} is not visible yet (attempt ${attempt}/30); retrying in ${delay}s."
              sleep "${delay}"
            fi
          done
          if [[ "${published_version}" != "${version}" ]]; then
            echo "cockroach-crawler@${version} was not available after 30 attempts; refusing to build or deploy the site." >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm --prefix website run build

      - name: Verify structure, routes, and assets
        run: npm --prefix website run check

      - name: Verify rendered pages in a browser
        run: npm --prefix website run check:browser

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy
