name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - bench/results/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cockroach-crawler-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: website
      url: https://cockroachcrawler.com
    env:
      SITE_STABLE_VERSION: 0.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the main deployment ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Website deployment is restricted to refs/heads/main." >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Wait for the exact npm package and dist-tag
        shell: bash
        run: |
          set -euo pipefail
          retry_delay_seconds() {
            local attempt="$1"
            local delay=$((2 ** (attempt - 1)))
            if (( delay > 30 )); then delay=30; fi
            printf '%s' "${delay}"
          }
          version="$(node -p 'require("./package.json").version')"
          published_version=""
          published_tag=""
          published_latest=""
          registry_ready=false
          dist_tag="$(VERSION="${version}" SITE_STABLE_VERSION="${SITE_STABLE_VERSION}" node --input-type=module -e '
            import { releaseChannelForVersion } from "./scripts/release-channel.mjs";
            process.stdout.write(releaseChannelForVersion(process.env.VERSION, process.env.SITE_STABLE_VERSION).distTag);
          ')"
          for attempt in {1..30}; do
            published_version="$(npm view "cockroach-crawler@${version}" version 2>/dev/null || true)"
            published_tag="$(npm view "cockroach-crawler@${dist_tag}" version 2>/dev/null || true)"
            published_latest="$(npm view "cockroach-crawler@latest" version 2>/dev/null || true)"
            if VERSION="${version}" PUBLISHED_VERSION="${published_version}" PUBLISHED_TAG="${published_tag}" PUBLISHED_LATEST="${published_latest}" SITE_STABLE_VERSION="${SITE_STABLE_VERSION}" node --input-type=module <<'NODE'
          import { validateRegistryState } from "./scripts/release-channel.mjs";
          validateRegistryState({
            version: process.env.VERSION,
            publishedVersion: process.env.PUBLISHED_VERSION,
            publishedTag: process.env.PUBLISHED_TAG,
            publishedLatest: process.env.PUBLISHED_LATEST,
            stableSiteVersion: process.env.SITE_STABLE_VERSION
          });
          NODE
            then
              registry_ready=true
              echo "cockroach-crawler@${version} is published on npm ${dist_tag}; website verification may proceed."
              break
            fi
            if (( attempt < 30 )); then
              delay="$(retry_delay_seconds "${attempt}")"
              echo "cockroach-crawler@${version}, npm ${dist_tag}, or stable latest is not coherent yet (attempt ${attempt}/30); retrying in ${delay}s."
              sleep "${delay}"
            fi
          done
          if [[ "${registry_ready}" != "true" ]]; then
            echo "cockroach-crawler@${version} was not coherent on npm ${dist_tag} after 30 attempts; refusing to build or deploy the site." >&2
            exit 1
          fi

      - name: Wait for the matching GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry_delay_seconds() {
            local attempt="$1"
            local delay=$((2 ** (attempt - 1)))
            if (( delay > 30 )); then delay=30; fi
            printf '%s' "${delay}"
          }
          version="$(node -p 'require("./package.json").version')"
          release_ready=false
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/v${version}"
          for attempt in {1..30}; do
            release_json="$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}" 2>/dev/null || true)"
            ref_json="$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" 2>/dev/null || true)"
            tag_object_sha="$(REF_JSON="${ref_json}" node --input-type=module -e '
              const ref = JSON.parse(process.env.REF_JSON || "null");
              if (ref?.object?.type === "tag" && /^[0-9a-f]{40}$/.test(ref.object.sha)) process.stdout.write(ref.object.sha);
            ')"
            tag_json=""
            if [[ -n "${tag_object_sha}" ]]; then
              tag_json="$(curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" 2>/dev/null || true)"
            fi
            target_sha="$(REF_JSON="${ref_json}" TAG_JSON="${tag_json}" node --input-type=module -e '
              const ref = JSON.parse(process.env.REF_JSON || "null");
              const tag = JSON.parse(process.env.TAG_JSON || "null");
              const target = ref?.object?.type === "commit"
                ? ref.object.sha
                : ref?.object?.type === "tag" && tag?.object?.type === "commit"
                  ? tag.object.sha
                  : "";
              if (/^[0-9a-f]{40}$/.test(target)) process.stdout.write(target);
            ')"
            compare_json=""
            if [[ -n "${target_sha}" ]]; then
              compare_json="$(curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/compare/${target_sha}...${GITHUB_SHA}" 2>/dev/null || true)"
            fi
            if RELEASE_JSON="${release_json}" REF_JSON="${ref_json}" TAG_JSON="${tag_json}" COMPARE_JSON="${compare_json}" EXPECTED_VERSION="${version}" EXPECTED_SHA="${GITHUB_SHA}" SITE_STABLE_VERSION="${SITE_STABLE_VERSION}" node --input-type=module <<'NODE'
          import { validateReleaseState } from "./scripts/release-channel.mjs";
          const release = JSON.parse(process.env.RELEASE_JSON || "null");
          const ref = JSON.parse(process.env.REF_JSON || "null");
          const tag = JSON.parse(process.env.TAG_JSON || "null");
          const compare = JSON.parse(process.env.COMPARE_JSON || "null");
          validateReleaseState({
            release,
            ref,
            tag,
            compare,
            expectedVersion: process.env.EXPECTED_VERSION,
            expectedSha: process.env.EXPECTED_SHA,
            stableSiteVersion: process.env.SITE_STABLE_VERSION
          });
          NODE
            then
              if [[ "${version}" != *-* ]]; then
                release_ready=true
                echo "Matching stable v${version} release assets are published; website verification may proceed."
                break
              fi
              release_dir="$(mktemp -d "${RUNNER_TEMP}/cockroach-release-assets.XXXXXX")"
              if gh release download "v${version}" --repo "${GITHUB_REPOSITORY}" --dir "${release_dir}" \
                && node scripts/stage-release-assets.mjs --verify-directory "${release_dir}"; then
                release_ready=true
                echo "Matching prerelease v${version} and byte-identical staged assets are published; website verification may proceed."
                break
              fi
            fi
            if (( attempt < 30 )); then
              delay="$(retry_delay_seconds "${attempt}")"
              echo "Matching v${version} release assets are not complete yet (attempt ${attempt}/30); retrying in ${delay}s."
              sleep "${delay}"
            fi
          done
          if [[ "${release_ready}" != "true" ]]; then
            echo "Matching v${version} release assets were not complete after 30 attempts; refusing to build or deploy the site." >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build
        run: npm --prefix website run build

      - name: Verify structure, routes, and assets
        run: npm --prefix website run check

      - name: Verify rendered pages in a browser
        run: npm --prefix website run check:browser

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: deploy
