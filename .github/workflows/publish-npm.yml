name: Publish npm (trusted)

# npm trusted publishing authorises ONE workflow filename per package. This file
# is the registered one, so every publishing path must live here. Adding a
# second publishing workflow does not work: npm rejects its OIDC token and the
# registry reports it as "404 Not Found - PUT", which reads like a missing
# package rather than an authorisation failure. See docs/RELEASE.md.
#
# Two entry points:
#   workflow_dispatch - strict. The caller states the version, commit, size,
#                       sha256, and integrity in advance and everything is
#                       compared against them.
#   push to main      - automatic when package.json changes the version. The
#                       artifact is measured in the verify job and the publish
#                       job re-measures and compares against it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        default: 0.7.0
        type: string
      expected_git_commit:
        description: Exact reviewed lowercase 40-character commit SHA
        required: true
        type: string
      dist_tag:
        description: npm dist-tag (prereleases use next; stable releases use latest)
        required: true
        default: latest
        type: choice
        options: [next, latest]
      expected_size_bytes:
        description: Approved npm tarball size in bytes
        required: true
        type: string
      expected_sha256:
        description: Approved SHA-256 of the npm tarball
        required: true
        type: string
      expected_integrity:
        description: Approved npm sha512 integrity
        required: true
        type: string
      confirmation:
        description: Type publish cockroach-crawler@VERSION
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: npm-publish-cockroach-crawler
  cancel-in-progress: false

jobs:
  detect:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      dist_tag: ${{ steps.decide.outputs.dist_tag }}
      strict: ${{ steps.decide.outputs.strict }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      # This job resolves no actions on purpose. "Failed to resolve action
      # download info" is a control-plane failure during job setup, before any
      # step runs, so the cheapest gate should not depend on it. gh and node are
      # preinstalled on the runner.
      - name: Decide
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          read_version() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=$1" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null \
              | node -pe 'try{JSON.parse(require("node:fs").readFileSync(0,"utf8")).version||""}catch{""}' 2>/dev/null \
              || echo ""
          }
          current="$(read_version "${GITHUB_SHA}")"
          [[ -n "${current}" ]] || { echo "Could not read package.json at ${GITHUB_SHA}." >&2; exit 1; }
          [[ "${current}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version." >&2; exit 1; }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${INPUT_VERSION}" == "${current}" ]] || {
              echo "Dispatch version ${INPUT_VERSION} does not match package.json ${current}." >&2; exit 1;
            }
            echo "strict=true" >> "${GITHUB_OUTPUT}"
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "version=${current}" >> "${GITHUB_OUTPUT}"
            echo "dist_tag=${INPUT_DIST_TAG}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          parent="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.parents[0].sha // empty')"
          previous=""
          if [[ -n "${parent}" ]]; then previous="$(read_version "${parent}")"; fi
          echo "current=${current} previous=${previous}"
          echo "strict=false" >> "${GITHUB_OUTPUT}"
          if [[ "${current}" == "${previous}" ]]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Version unchanged; nothing to publish."
            exit 0
          fi
          if npm view "cockroach-crawler@${current}" version >/dev/null 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "cockroach-crawler@${current} is already published; refusing to republish."
            exit 0
          fi
          if [[ "${current}" == *-* ]]; then tag=next; else tag=latest; fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"
          echo "version=${current}" >> "${GITHUB_OUTPUT}"
          echo "dist_tag=${tag}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify approved artifact
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      size_bytes: ${{ steps.pack.outputs.size_bytes }}
      integrity: ${{ steps.pack.outputs.integrity }}
    env:
      STRICT: ${{ needs.detect.outputs.strict }}
      EXPECTED_VERSION: ${{ needs.detect.outputs.version }}
      DIST_TAG: ${{ needs.detect.outputs.dist_tag }}
      EXPECTED_GIT_COMMIT: ${{ inputs.expected_git_commit }}
      EXPECTED_SIZE_BYTES: ${{ inputs.expected_size_bytes }}
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      EXPECTED_INTEGRITY: ${{ inputs.expected_integrity }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Publish from main only." >&2; exit 1; }
          [[ "${GITHUB_REPOSITORY}" == "AjnasNB/cockroach-crawler" ]] || { echo "Unexpected repository." >&2; exit 1; }
          if [[ "${EXPECTED_VERSION}" == *-* && "${DIST_TAG}" != "next" ]]; then
            echo "Prereleases must use the next dist-tag." >&2; exit 1
          fi
          if [[ "${EXPECTED_VERSION}" != *-* && "${DIST_TAG}" != "latest" ]]; then
            echo "Stable releases must use the latest dist-tag." >&2; exit 1
          fi
          if [[ "${STRICT}" != "true" ]]; then
            echo "Automatic publish for ${EXPECTED_VERSION}; artifact digests are measured here and re-checked before publish."
            exit 0
          fi
          [[ "${EXPECTED_GIT_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid reviewed commit." >&2; exit 1; }
          [[ "${EXPECTED_GIT_COMMIT}" == "${GITHUB_SHA}" ]] || { echo "Reviewed commit does not match the workflow commit." >&2; exit 1; }
          [[ "${EXPECTED_SIZE_BYTES}" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid size." >&2; exit 1; }
          [[ "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid SHA-256." >&2; exit 1; }
          [[ "${EXPECTED_INTEGRITY}" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]] || { echo "Invalid integrity." >&2; exit 1; }
          [[ "${CONFIRMATION}" == "publish cockroach-crawler@${EXPECTED_VERSION}" ]] || { echo "Confirmation mismatch." >&2; exit 1; }

      - name: Check out approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "12.0.1"
      - name: Verify package identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (manifest.name !== "cockroach-crawler") throw new Error(`Unexpected package: ${manifest.name}`);
          if (manifest.version !== process.env.EXPECTED_VERSION) throw new Error(`Unexpected version: ${manifest.version}`);
          if (manifest.repository?.url !== "git+https://github.com/AjnasNB/cockroach-crawler.git") throw new Error("Unexpected repository URL.");
          NODE
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run complete release gate
        run: npm run release:check
      - name: Verify published benchmark evidence
        run: npm run bench:public:verify
      - name: Confirm version is unpublished
        shell: bash
        run: |
          error_file="${RUNNER_TEMP}/npm-view.err"
          if npm view "cockroach-crawler@${EXPECTED_VERSION}" version >/dev/null 2>"${error_file}"; then
            echo "Version already exists." >&2; exit 1
          fi
          grep -Eq "E404|404 Not Found" "${error_file}" || { cat "${error_file}" >&2; exit 1; }
      - name: Pack and verify exact artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/approved-pack"; mkdir -p "${pack_dir}"
          npm pack --ignore-scripts --pack-destination "${pack_dir}" --json > "${RUNNER_TEMP}/pack.json"
          tarball="${pack_dir}/cockroach-crawler-${EXPECTED_VERSION}.tgz"; test -f "${tarball}"
          size="$(wc -c < "${tarball}" | tr -d '[:space:]')"
          sha256="$(sha256sum "${tarball}" | awk '{print $1}')"
          integrity="sha512-$(openssl dgst -sha512 -binary "${tarball}" | openssl base64 -A)"
          if [[ "${STRICT}" == "true" ]]; then
            [[ "${size}" == "${EXPECTED_SIZE_BYTES}" ]] || { echo "Size mismatch: ${size}" >&2; exit 1; }
            [[ "${sha256}" == "${EXPECTED_SHA256}" ]] || { echo "SHA-256 mismatch: ${sha256}" >&2; exit 1; }
            [[ "${integrity}" == "${EXPECTED_INTEGRITY}" ]] || { echo "Integrity mismatch." >&2; exit 1; }
          fi
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          echo "size_bytes=${size}" >> "${GITHUB_OUTPUT}"
          echo "integrity=${integrity}" >> "${GITHUB_OUTPUT}"
          printf '## Approved artifact\n\n- Package: `cockroach-crawler@%s`\n- Tag: `%s`\n- Commit: `%s`\n- Size: `%s` bytes\n- SHA-256: `%s`\n- Integrity: `%s`\n' "${EXPECTED_VERSION}" "${DIST_TAG}" "${GITHUB_SHA}" "${size}" "${sha256}" "${integrity}" >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish after maintainer approval
    needs: [detect, verify]
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/cockroach-crawler/v/${{ needs.detect.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      STRICT: ${{ needs.detect.outputs.strict }}
      EXPECTED_VERSION: ${{ needs.detect.outputs.version }}
      DIST_TAG: ${{ needs.detect.outputs.dist_tag }}
      EXPECTED_GIT_COMMIT: ${{ inputs.expected_git_commit }}
      EXPECTED_SIZE_BYTES: ${{ needs.verify.outputs.size_bytes }}
      EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
      EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.0.1 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "12.0.1"
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Repack approved artifact
        id: repack
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${STRICT}" == "true" ]]; then
            [[ "${EXPECTED_GIT_COMMIT}" == "${GITHUB_SHA}" ]] || { echo "Reviewed commit changed before publication." >&2; exit 1; }
          fi
          pack_dir="${RUNNER_TEMP}/publish-pack"; mkdir -p "${pack_dir}"
          npm pack --ignore-scripts --pack-destination "${pack_dir}" --json > "${RUNNER_TEMP}/pack.json"
          tarball="${pack_dir}/cockroach-crawler-${EXPECTED_VERSION}.tgz"
          size="$(wc -c < "${tarball}" | tr -d '[:space:]')"
          sha256="$(sha256sum "${tarball}" | awk '{print $1}')"
          integrity="sha512-$(openssl dgst -sha512 -binary "${tarball}" | openssl base64 -A)"
          [[ "${size}" == "${EXPECTED_SIZE_BYTES}" ]] || { echo "Tarball size changed since verification." >&2; exit 1; }
          [[ "${sha256}" == "${EXPECTED_SHA256}" ]] || { echo "Tarball digest changed since verification." >&2; exit 1; }
          [[ "${integrity}" == "${EXPECTED_INTEGRITY}" ]] || { echo "Tarball integrity changed since verification." >&2; exit 1; }
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
      - name: Reconfirm version is unpublished
        shell: bash
        run: |
          error_file="${RUNNER_TEMP}/npm-view.err"
          if npm view "cockroach-crawler@${EXPECTED_VERSION}" version >/dev/null 2>"${error_file}"; then exit 1; fi
          grep -Eq "E404|404 Not Found" "${error_file}" || exit 1
      - name: Publish with npm Trusted Publishing
        run: npm publish "${{ steps.repack.outputs.tarball }}" --access public --ignore-scripts --provenance --tag "${DIST_TAG}"
      - name: Verify registry identity and provenance
        shell: bash
        run: |
          set -euo pipefail
          retry_delay_seconds() {
            local attempt="$1"
            local delay=$((2 ** (attempt - 1)))
            if (( delay > 30 )); then delay=30; fi
            printf '%s' "${delay}"
          }
          verified=false
          for attempt in {1..10}; do
            version="$(npm view "cockroach-crawler@${EXPECTED_VERSION}" version 2>/dev/null || true)"
            integrity="$(npm view "cockroach-crawler@${EXPECTED_VERSION}" dist.integrity 2>/dev/null || true)"
            predicate="$(npm view "cockroach-crawler@${EXPECTED_VERSION}" dist.attestations.provenance.predicateType 2>/dev/null || true)"
            tag_version="$(npm view "cockroach-crawler@${DIST_TAG}" version 2>/dev/null || true)"
            if [[ "${version}" == "${EXPECTED_VERSION}" && "${integrity}" == "${EXPECTED_INTEGRITY}" && "${predicate}" == "https://slsa.dev/provenance/v1" && "${tag_version}" == "${EXPECTED_VERSION}" ]]; then
              verified=true
              break
            fi
            if (( attempt < 10 )); then
              delay="$(retry_delay_seconds "${attempt}")"
              echo "Registry identity or provenance is not coherent yet (attempt ${attempt}/10); retrying in ${delay}s."
              sleep "${delay}"
            fi
          done
          if [[ "${verified}" != "true" ]]; then
            echo "Registry identity and provenance did not converge after 10 attempts." >&2
            echo "Observed version=${version:-missing} tag=${tag_version:-missing} integrity=${integrity:-missing} predicate=${predicate:-missing}" >&2
            exit 1
          fi
          printf '## Publication verified\n\n- Version: `%s`\n- Dist-tag: `%s`\n- Integrity: `%s`\n- Provenance: `%s`\n- Workflow commit: `%s`\n' "${version}" "${DIST_TAG}" "${integrity}" "${predicate}" "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Verify installed signatures and exports
        shell: bash
        run: |
          set -euo pipefail
          retry_delay_seconds() {
            local attempt="$1"
            local delay=$((2 ** (attempt - 1)))
            if (( delay > 30 )); then delay=30; fi
            printf '%s' "${delay}"
          }
          consumer="${RUNNER_TEMP}/consumer"; mkdir -p "${consumer}"; cd "${consumer}"
          npm init --yes >/dev/null
          installed=false
          for attempt in {1..10}; do
            if npm install "cockroach-crawler@${EXPECTED_VERSION}" --ignore-scripts; then
              installed=true
              break
            fi
            if (( attempt < 10 )); then
              delay="$(retry_delay_seconds "${attempt}")"
              echo "Registry install is not available yet (attempt ${attempt}/10); retrying in ${delay}s."
              sleep "${delay}"
            fi
          done
          if [[ "${installed}" != "true" ]]; then
            echo "Registry install did not succeed after 10 attempts." >&2
            exit 1
          fi
          node --input-type=module -e "await import('cockroach-crawler'); await import('cockroach-crawler/agent'); await import('cockroach-crawler/sources'); await import('cockroach-crawler/serverless'); await import('cockroach-crawler/quality')"
          signatures_verified=false
          for attempt in {1..10}; do
            if npm audit signatures; then
              signatures_verified=true
              break
            fi
            if (( attempt < 10 )); then
              delay="$(retry_delay_seconds "${attempt}")"
              echo "Registry signatures or attestations are not available yet (attempt ${attempt}/10); retrying in ${delay}s."
              sleep "${delay}"
            fi
          done
          if [[ "${signatures_verified}" != "true" ]]; then
            echo "Registry signature verification did not succeed after 10 attempts." >&2
            exit 1
          fi
